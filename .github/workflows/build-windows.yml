name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["utama", "main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build EXE
        run: dotnet publish HongguoStarter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HongguoDownloader-Windows
          path: publish/HongguoDownloader.exe
